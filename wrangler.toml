name = "expense-manager"
main = "src/worker.ts"
compatibility_date = "2026-09-08"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
# API routes must execute the Worker before the SPA fallback can serve index.html.
run_worker_first = ["/api/*"]

[cache]
# Never cache the API/router Worker. OAuth redirects and authenticated API responses
# must always reach the Worker rather than receiving a stale SPA response.
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "expense-manager"
database_id = "9fa680d1-3ad3-4712-93ed-4ce2ea9f7025"
migrations_dir = "migrations"

# Daily materialization of due recurring rules (00:30 UTC ~ 06:00 IST).
[triggers]
crons = ["30 0 * * *"]

# Secrets (set via `wrangler secret put <NAME>`):
#   APP_PASSWORD               - the single password gate for this app (see docs/cloudflare-setup.md)
#   GOOGLE_OAUTH_CLIENT_ID     - OAuth 2.0 Web client ID from Google Cloud Console
#   GOOGLE_OAUTH_CLIENT_SECRET - OAuth 2.0 Web client secret
#   DRIVE_TOKEN_ENCRYPTION_KEY - random 32-byte base64 key (e.g. `openssl rand -base64 32`)
#   Redirect URI to register on the OAuth client:
#     https://expense-manager.ksinghal464.workers.dev/api/drive/callback
#   Scope requested: https://www.googleapis.com/auth/drive.file
#   (per-file access only — the app can only see files it created itself)
